name: Update Feature Gates
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *" # Daily at 3:23 am UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read .nvmrc
        id: nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}

      # scripts/update-feature-gates.ts imports app/entities/feature-gate/server, which reaches the
      # built @explorer/parsers through app/validators/pubkey.ts.
      - name: Build workspace packages
        run: pnpm build:packages

      - name: Update feature gates
        run: pnpm exec tsx scripts/update-feature-gates.ts

      - name: Create Pull Request
        id: create_pull_request
        continue-on-error: true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch-token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          commit-message: "Update feature gates from Agave wiki"
          title: "Automated Feature Gates Update"
          body: "Auto-generated PR from daily feature gates check"
          branch: "feature-gates-update"
          base: master
          maintainer-can-modify: true
          delete-branch: true

      - name: Note PR creation limitation
        if: steps.create_pull_request.outcome == 'failure'
        run: |
          {
            echo "## Pull request creation skipped"
            echo
            echo "The feature-gate data refresh completed, but this repository does not allow GitHub Actions to create pull requests with \`GITHUB_TOKEN\`."
            echo "Enable **Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests** to restore automatic PR creation."
          } >> "$GITHUB_STEP_SUMMARY"
